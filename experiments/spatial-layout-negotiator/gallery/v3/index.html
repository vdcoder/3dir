<h1>Spatial Layout Negotiator α.v3 — gallery</h1>
<p class="lead">Pack exact. Center naturally. Grow intelligently only inside rooms. MAX_ROOM_WIDTH 10 m, MAX_SHELF_SEGMENT_LENGTH 9 m. 38 drawn layouts validated: 0 violations. <a href="../index.html">α.v2 gallery</a> · <a href="../sensitivity/index.html">sensitivity study</a></p>
<figure><figcaption><b>A · Shortest-first shelving: the same nine folders with C = 1, 2, 3 and 4 shelves per row</b>Shelves sorted by required length; the first row takes the C shortest and sets the room width; later rows take shelves in order while they fit that width. Ticks: where each shelf's own requirement ends (the rest is display space).</figcaption><a href="a-shortest-first.svg"><img src="a-shortest-first.svg" alt="A · Shortest-first shelving: the same nine folders with C = 1, 2, 3 and 4 shelves per row"></a></figure>
<figure><figcaption><b>B · Per-row normalization: equal shelves within a row, different lengths between rows</b>The C = 3 room from sheet A, zoomed on its shelves. In each row every fixture takes the row's longest required length; shorter folders keep the difference as display space (orange). Rows are independent.</figcaption><a href="b-per-row-normalization.svg"><img src="b-per-row-normalization.svg" alt="B · Per-row normalization: equal shelves within a row, different lengths between rows"></a></figure>
<figure><figcaption><b>C · A segmented shelf: one 42.8 m folder as 5 consecutive 9 m segments</b>The folder "Board minutes 1998-2026" needs more than one fixture, so its books are split in order (never splitting a book) into full-length segments, one dedicated row each, at the rear. Dashed rails on both sides, a connector to every segment and one label mark them as one folder; the last segment keeps its spare length as a display bay.</figcaption><a href="c-segmented-shelf.svg"><img src="c-segmented-shelf.svg" alt="C · A segmented shelf: one 42.8 m folder as 5 consecutive 9 m segments"></a></figure>
<figure><figcaption><b>D · The extreme room: ≈1,000 m of one folder, 40 other folders and 600 loose files</b>A bounded-width room (10 m ≤ MAX_ROOM_WIDTH) that grows only in depth: 121 segments in a consecutive stack at the rear, 40 ordinary shelves in shortest-first rows, and one file table holding all 600 files.</figcaption><a href="d-extreme-room.svg"><img src="d-extreme-room.svg" alt="D · The extreme room: ≈1,000 m of one folder, 40 other folders and 600 loose files"></a></figure>
<figure><figcaption><b>E · Smart room growth: the same room given more depth and width</b>Shelves, segments and the file table never change. Extra depth becomes a front zone (with a walkway to the door) and, when there is a lot, a middle zone between the shelves and the table; extra width becomes a side zone. Features come from a fixed library; what fits nothing stays as circulation. A client room starts with a waiting area; training, home and finance rooms prefer a classroom, a lounge and workstations.</figcaption><a href="e-smart-room-expansion.svg"><img src="e-smart-room-expansion.svg" alt="E · Smart room growth: the same room given more depth and width"></a></figure>
<figure><figcaption><b>F · Building alignment: three rooms of different minimum depths share one row depth</b>The building keeps its measured footprint, walls, partitions and entrance hall. The rooms in its row take the common depth; the shallower rooms absorb the difference inside (here as deeper entrance clearance or a front zone) while their shelves and table keep the geometry of their own minimum layout (bottom row, same scale).</figcaption><a href="f-building-alignment.svg"><img src="f-building-alignment.svg" alt="F · Building alignment: three rooms of different minimum depths share one row depth"></a></figure>
<figure><figcaption><b>G · Campus centering: buildings of unequal size, never resized</b>Each row is as deep as its deepest building. Buildings keep their measured footprints and sit centered in their cells (dashed); the rest of each cell is grounds, and an entrance walk joins each shorter building's door to the street or plaza in front. Paths (3 m), streets (6 m), the courtyard and the plaza keep their designed widths.</figcaption><a href="g-campus-centering.svg"><img src="g-campus-centering.svg" alt="G · Campus centering: buildings of unequal size, never resized"></a></figure>
<figure><figcaption><b>H · Exact packing: Area → Area → Area → Campus → Building → Room → Bookshelf</b>C:\Users\Amanda (fictional) laid out by α.v3 at exactly its measured size. Every area places each child at precisely its selected offer's dimensions (largest deviation shown under each area: 0); campuses and buildings keep theirs; only rooms grow inside.</figcaption><a href="h-area-exact-packing.svg"><img src="h-area-exact-packing.svg" alt="H · Exact packing: Area → Area → Area → Campus → Building → Room → Bookshelf"></a></figure>
<figure><figcaption><b>I · The same synthetic tree (~100 containers, seed 1) laid out by α.v2 and α.v3</b>Left: α.v2 at its minimum size (uniform sampling, 20% absorption). Right: α.v3 (balanced sampling, exact sizes). Same scale in each row. Bottom: the same campus in both.</figcaption><a href="i-v2-vs-v3.svg"><img src="i-v2-vs-v3.svg" alt="I · The same synthetic tree (~100 containers, seed 1) laid out by α.v2 and α.v3"></a></figure>
<figure><figcaption><b>J · Known weakness: one very deep room sets the depth of its whole building row</b>The demo with one ≈1,000 m folder added to Finance › Budgets. α.v3 keeps that room 10 m wide and 155.0 m deep, but Invoices shares its row and must take the same depth: 2.4 × 5.0 m becomes 2.4 × 155.0 m of mostly open floor. α.v2 (right, at another scale) instead makes the room and the whole building over a kilometre wide.</figcaption><a href="j-known-weakness-deep-row.svg"><img src="j-known-weakness-deep-row.svg" alt="J · Known weakness: one very deep room sets the depth of its whole building row"></a></figure>
